name: Generate Test Reports

on:
  push:
    branches: [ "main" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 1. Run Web/Backend E2E Tests
      - name: Install E2E Dependencies
        working-directory: ./e2e-testing
        run: npm install

      - name: Run E2E Tests
        working-directory: ./e2e-testing
        run: node runner.js

      # 2. Run Mobile Appium Tests
      - name: Install Mobile Test Dependencies
        working-directory: ./mobile/appium-tests
        run: npm install

      - name: Run Mobile Appium Tests
        working-directory: ./mobile/appium-tests
        run: node run_appium_tests.js

      # 3. Upload Both Test Reports as Downloadable Artifacts
      - name: Upload Test Reports (Excel and CSV)
        uses: actions/upload-artifact@v4
        with:
          name: Full-Test-Reports
          path: |
            e2e-testing/Test_Analysis_Report_Final.csv
            mobile/appium-tests/Appium_E2E_Test_Report.xlsx
