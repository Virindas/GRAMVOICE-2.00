name: E2E - Web Selenium Tests
on: [push]
jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm install
        working-directory: ./e2e-testing
      - run: node runner.js
        working-directory: ./e2e-testing
      - uses: actions/upload-artifact@v4
        with:
          name: Web_E2E_Test_Report
          path: e2e-testing/Test_Analysis_Report_Final.csv
